<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vamp Store — Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .admin {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .admin-card {
            background: #151518;
            border: 1px solid #252529;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .admin-card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .admin-button {
            width: 100%;
            background: white;
            color: black;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .admin-button:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body>

    <div class="admin">

        <div class="logo">
            Vamp Store
        </div>

        <div class="subtitle">
            Панель управления
        </div>

        <div class="admin-card">

            <h2>
                Товары
            </h2>

            <div id="productsList"></div>

            <button
                class="admin-button"
                onclick="addProduct()"
            >
                ＋ Добавить товар
            </button>

        </div>

        <div class="admin-card">

            <h2>
                Заказы
            </h2>

            <div style="color:#888;">
                Пока заказов нет
            </div>

        </div>

    </div>

    <script>

        const savedProducts = localStorage.getItem("vampProducts");

        const products = [
    {
        name: "ERD Hoodie",
        price: "2600 грн / $33",
        image: "photo_5834783088632860965_x.jpg"
    },
    {
        name: "Maison Margiela Replica Gats",
        price: "3690 грн / $83",
        image: "photo_6028305136645508682_x.jpg"
    },
    {
        name: "Balenciaga Tee",
        price: "1750 грн / $33",
        image: "photo_5981002711899508346_y.jpg"
    }
];

        if (savedProducts) {
    products.splice(
        0,
        products.length,
        ...JSON.parse(savedProducts)
    );
}

const productsList = document.getElementById("productsList");


function editProduct(name) {

    const newPrice = prompt(
        "Введите новую цену для " + name
    );

    if (!newPrice) {
        return;
    }

    const product = products.find(
        product => product.name === name
    );

    if (!product) {
        return;
    }

    product.price = newPrice;

    localStorage.setItem(
    "vampProducts",
    JSON.stringify(products)
);

    renderProducts();

}

function renderProducts() {

    productsList.innerHTML = "";

    products.forEach(product => {

        productsList.innerHTML += `
            <div style="
                display:flex;
                align-items:center;
                gap:15px;
                margin-bottom:15px;
                padding:12px;
                background:#202024;
                border-radius:14px;
            ">

                <img
                    src="${product.image}"
                    style="
                        width:70px;
                        height:70px;
                        object-fit:cover;
                        border-radius:10px;
                    "
                >

                <div>

                    <div style="
                        font-weight:700;
                        margin-bottom:5px;
                    ">
                        ${product.name}
                    </div>

                    <div style="color:#aaa;">
                        ${product.price}
                    </div>

                    <button
                        onclick="editProduct('${product.name}')"
                        style="
                            margin-top:10px;
                            background:white;
                            color:black;
                            border:none;
                            padding:8px 12px;
                            border-radius:8px;
                            font-weight:700;
                            cursor:pointer;
                        "
                    >
                        ✏️ Изменить
                    </button>

                </div>

            </div>
        `;

    });

}

        renderProducts();
        
    </script>

</body>
</html>
