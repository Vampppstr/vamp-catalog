<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vamp Store — Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .admin {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .admin-card {
            background: #151518;
            border: 1px solid #252529;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .admin-card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .admin-button {
            width: 100%;
            background: white;
            color: black;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .admin-button:hover {
            opacity: 0.9;
        }

        .edit-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
}

.edit-modal.show {
    display: flex;
}

.edit-modal-content {
    width: 100%;
    max-width: 500px;
    background: #151518;
    border: 1px solid #2a2a2f;
    border-radius: 22px;
    padding: 25px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.edit-modal-content h2 {
    margin-top: 0;
    margin-bottom: 20px;
}

.edit-modal-content input {
    width: 100%;
    box-sizing: border-box;
    background: #202024;
    border: 1px solid #303035;
    color: white;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 12px;
    font-size: 15px;
    outline: none;
}

.edit-modal-content input:focus {
    border-color: white;
}

.edit-close {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 10px;
    background: #202024;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.edit-save {
    width: 100%;
    background: white;
    color: black;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 5px;
}

    </style>

</head>

<body>

    <div class="admin">

        <div class="logo">
            Vamp Store
        </div>

        <div class="subtitle">
            Панель управления
        </div>

        <div class="admin-card">

            <h2>
                Товары
            </h2>

            <div id="productsList"></div>

            <button
                class="admin-button"
                onclick="addProduct()"
            >
                ＋ Добавить товар
            </button>

        </div>

        <div class="admin-card">

            <h2>
                Заказы
            </h2>

            <div style="color:#888;">
                Пока заказов нет
            </div>

        </div>

    </div>

    <script>

        const savedProducts = localStorage.getItem("vampProducts");

        const products = [
    {
        name: "ERD Hoodie",
        price: "2600 грн / $33",
        image: "photo_5834783088632860965_x.jpg"
    },
    {
        name: "Maison Margiela Replica Gats",
        price: "3690 грн / $83",
        image: "photo_6028305136645508682_x.jpg"
    },
    {
        name: "Balenciaga Tee",
        price: "1750 грн / $33",
        image: "photo_5981002711899508346_y.jpg"
    }
];

        if (savedProducts) {
    products.splice(
        0,
        products.length,
        ...JSON.parse(savedProducts)
    );
}

const productsList = document.getElementById("productsList");

     function addProduct() {

    const name = prompt("Введите название товара:");

    if (!name) {
        return;
    }

    const price = prompt("Введите цену товара:");

    if (!price) {
        return;
    }

    const image = prompt("Введите имя файла изображения:");

    if (!image) {
        return;
    }

         const sizesInput = prompt(
    "Введите размеры через запятую (например: S, M, L, XL):"
);

if (!sizesInput) {
    return;
}

const sizes = sizesInput
    .split(",")
    .map(size => size.trim())
    .filter(size => size);

   products.push({
    name: name,
    price: price,
    image: image,
    sizes: sizes
        });

    localStorage.setItem(
        "vampProducts",
        JSON.stringify(products)
    );

    renderProducts();
}   

        let editingProduct = null;

function editProduct(name) {

    const product = products.find(
        product => product.name === name
    );

    if (!product) {
        return;
    }

    editingProduct = product;

    console.log("editName:", document.getElementById("editName"));
console.log("editPrice:", document.getElementById("editPrice"));
console.log("editImage:", document.getElementById("editImage"));
console.log("editSizes:", document.getElementById("editSizes"));
    
    const imagePreview = document.getElementById("editImagePreview");

imagePreview.src = product.image;
imagePreview.style.display = "block";
    
    document.getElementById("editSizes").value = product.sizes
        ? product.sizes.join(", ")
        : "";

    document.getElementById("editModal").classList.add("show");

}

        function updateImagePreview() {

    const image = document.getElementById("editImage").value.trim();
    const preview = document.getElementById("editImagePreview");

    if (!image) {
        preview.style.display = "none";
        return;
    }

    preview.src = image;
    preview.style.display = "block";

}

        function closeEditModal() {

    document.getElementById("editModal").classList.remove("show");

}


        function saveEditProduct() {

    if (!editingProduct) {
        return;
    }

    const newName = document.getElementById("editName").value.trim();
    const newPrice = document.getElementById("editPrice").value.trim();
    const newImage = document.getElementById("editImage").value.trim();
    const sizesInput = document.getElementById("editSizes").value.trim();

    if (!newName || !newPrice || !newImage || !sizesInput) {
        alert("Заполните все поля.");
        return;
    }

    editingProduct.name = newName;
    editingProduct.price = newPrice;
    editingProduct.image = newImage;

    editingProduct.sizes = sizesInput
        .split(",")
        .map(size => size.trim())
        .filter(size => size);

    localStorage.setItem(
        "vampProducts",
        JSON.stringify(products)
    );

    renderProducts();

    closeEditModal();

    editingProduct = null;
}
        

      function deleteProduct(name) {

    const confirmDelete = confirm(
        "Удалить товар " + name + "?"
    );

    if (!confirmDelete) {
        return;
    }

    const index = products.findIndex(
        product => product.name === name
    );

    if (index === -1) {
        return;
    }

    products.splice(index, 1);

    localStorage.setItem(
        "vampProducts",
        JSON.stringify(products)
    );

    renderProducts();
}
        

function renderProducts() {

    productsList.innerHTML = "";

    products.forEach(product => {

        productsList.innerHTML += `
            <div style="
                display:flex;
                align-items:center;
                gap:15px;
                margin-bottom:15px;
                padding:12px;
                background:#202024;
                border-radius:14px;
            ">

                <img
                    src="${product.image}"
                    style="
                        width:70px;
                        height:70px;
                        object-fit:cover;
                        border-radius:10px;
                    "
                >

                <div>

                    <div style="
                        font-weight:700;
                        margin-bottom:5px;
                    ">
                        ${product.name}
                    </div>

                    <div style="color:#aaa;">
                        ${product.price}
                    </div>

                    <button
                        onclick="editProduct('${product.name}')"
                        style="
                            margin-top:10px;
                            background:white;
                            color:black;
                            border:none;
                            padding:8px 12px;
                            border-radius:8px;
                            font-weight:700;
                            cursor:pointer;
                        "
                    >
                        ✏️ Изменить
                    </button>

                    <button
                        onclick="deleteProduct('${product.name}')"
                        style="
                            margin-top:10px;
                            margin-left:5px;
                            background:#ff4444;
                            color:white;
                            border:none;
                            padding:8px 12px;
                            border-radius:8px;
                            font-weight:700;
                            cursor:pointer;
                        "
                    >
                        🗑 Удалить
                    </button>

                </div>

            </div>
        `;

    });

}

        renderProducts();
        
    </script>

    <div id="editModal" class="edit-modal">

    <div class="edit-modal-content">

        <button
            class="edit-close"
            onclick="closeEditModal()"
        >
            ×
        </button>

        <h2>Редактировать товар</h2>

        <input
            id="editName"
            type="text"
            placeholder="Название товара"
        >

        <input
    id="editImage"
    type="text"
    placeholder="Имя файла изображения"
    oninput="updateImagePreview()"
>

        <input
            id="editImage"
            type="text"
            placeholder="Имя файла изображения"
        >

        <img
    id="editImagePreview"
    style="
        width: 100%;
        max-height: 300px;
        object-fit: contain;
        border-radius: 14px;
        margin-bottom: 15px;
        display: none;
        background: #202024;
    "
>

        <input
            id="editSizes"
            type="text"
            placeholder="Размеры: S, M, L, XL"
        >

        <button
            class="edit-save"
            onclick="saveEditProduct()"
        >
            💾 Сохранить изменения
        </button>

    </div>

</div>

</body>
</html>
