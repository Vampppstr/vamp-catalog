<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vamp Store</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b0d;
    color: white;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;

    background:
        radial-gradient(
            ellipse 180px 70% at 0% 50%,
            rgba(120, 0, 0, 0.26) 0%,
            rgba(80, 0, 0, 0.13) 35%,
            rgba(0, 0, 0, 0) 100%
        ),
        radial-gradient(
            ellipse 180px 70% at 100% 50%,
            rgba(120, 0, 0, 0.26) 0%,
            rgba(80, 0, 0, 0.13) 35%,
            rgba(0, 0, 0, 0) 100%
        );
}

    .header,
.categories,
.products,
.modal,
.side-menu,
.menu-button {
    position: relative;
    z-index: 1;
}

.header {
    padding: 25px 18px 15px;
    position: sticky;
    top: 0;
    background: rgba(11,11,13,0.95);
    backdrop-filter: blur(10px);
    z-index: 10;
}

  
.logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 18px;
    margin-left: 42px;
}

.search {
    width: 100%;
    background: #19191d;
    border: 1px solid #29292e;
    border-radius: 14px;
    padding: 14px 16px;
    color: white;
    font-size: 15px;
    outline: none;
}

.search::placeholder {
    color: #777;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 15px 18px;
}

.category {
    border: none;
    background: #19191d;
    color: #aaa;
    padding: 10px 16px;
    border-radius: 20px;
    white-space: nowrap;
    cursor: pointer;
}

.category.active {
    background: white;
    color: black;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 5px 14px 30px;
}

.product {
    background: #151518;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s;
}

.product:active {
    transform: scale(0.97);
}

.product-image {
    width: 100%;
    aspect-ratio: 1 / 1.15;
    object-fit: cover;
    display: block;
}

.product-info {
    padding: 12px;
}

.product-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

.product-price {
    font-size: 16px;
    font-weight: 700;
}

.product-category {
    font-size: 11px;
    color: #777;
    margin-top: 5px;
}

.empty {
    display: none;
    text-align: center;
    color: #777;
    padding: 60px 20px;
    grid-column: 1 / -1;
}

/* ОКНО ТОВАРА */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(8px);
    display: none;
    align-items: flex-end;
    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: #151518;
    width: 100%;
    max-width: none;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 24px 24px 0 0;
    padding-bottom: 25px;
    animation: slideUp 0.2s ease;
    margin: 0;
}
@keyframes slideUp {
    from {
        transform: translateY(30px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}

    .modal-image-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.modal-image {
    width: 100%;
    height: auto;
    object-fit: contain;
    border-radius: 20px 20px 0 0;
    display: block;
}
    
.modal-info {
    padding: 20px 20px 10px;
}

.modal-name {
    font-size: 24px;
    font-weight: 800;
    margin-bottom: 8px;
    line-height: 1.15;
}

.modal-price {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: 0.2px;
}

.modal-description {
    color: #aaa;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 18px;
}

.sizes-title {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 10px;
}

    .colors {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 5px 0 12px;
    margin-bottom: 5px;
}

.color-image {
    width: 58px;
    height: 58px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid transparent;
    flex-shrink: 0;
    cursor: pointer;
    transition: 0.15s ease;
}

.color-image:hover {
    transform: scale(1.05);
}

.color-image:active {
    transform: scale(0.95);
}

.sizes {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.size {
    background: #202024;
    border: 1px solid #303035;
    color: white;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    transition: 0.15s ease;
}
    .size.selected {
    background: white;
    color: black;
    border-color: white;
    transform: scale(1.03);
}


.order {
    width: 85%;
    margin: 0 auto;
    display: block;
    border: none;
    background: white;
    color: black;
    padding: 7px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.15s ease;
}
    
    .order:hover {
    transform: scale(1.02);
    opacity: 0.9;
}

.order:active {
    transform: scale(0.98);
}
    
.close {
    position: absolute;
    right: 15px;
    top: 15px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.side-menu {
    position: fixed;
    top: 0;
    left: 0;
    width: 280px;
    height: 100vh;
    background: #151518;
    z-index: 250;
    padding: 80px 20px 20px;
    transform: translateX(-100%);
    transition: 0.25s ease;
    box-shadow: 10px 0 30px rgba(0,0,0,0.4);

}

   .menu-button {
    position: fixed;
    top: 22px;
    left: 18px;
    width: 40px;
    height: 40px;
    padding: 0;
    background: transparent;
    border: none;
    color: white;
    font-size: 26px;
    line-height: 40px;
    text-align: center;
    cursor: pointer;
    z-index: 99999;
}

    
.menu-button.open {
    position: fixed;
    z-index: 1000;
}

.side-menu.show {
    transform: translateX(0);
}

.side-menu-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 20px;
}

.side-menu button {
    width: 100%;
    background: #202024;
    border: 1px solid #303035;
    color: white;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    text-align: left;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

   
    
</style>
</head>

<body>


<button class="menu-button" onclick="openMenu()" id="menuButton">☰</button>

<header class="header">

    <div class="logo">
        Vamp Store
    </div>
    
</header>
    
    <div id="sideMenu" class="side-menu">



        <input
    class="search"
    id="search"
    placeholder="🔍 Поиск товаров..."
>

    <div class="side-menu-title">
        Бренды
    </div>

    <button onclick="filterBrand('all')">Все товары</button>
    <button onclick="filterBrand('Balenciaga')">Balenciaga</button>
    <button onclick="filterBrand('Fear Of God')">Fear Of God</button>
    <button onclick="filterBrand('Maison Margiela')">Maison Margiela</button>
    <button onclick="filterBrand('ERD')">ERD</button>
    <button onclick="filterBrand('Amiri')">Amiri</button>
    <button onclick="filterBrand('Acne Studios')">Acne Studios</button>

</div>


<div class="categories">

    <button class="category active" onclick="filterProducts('all', this)">
        Все
    </button>

    <button class="category" onclick="filterProducts('hoodies', this)">
        Худи
    </button>

    <button class="category" onclick="filterProducts('shoes', this)">
        Обувь
    </button>

    <button class="category" onclick="filterProducts('tshirts', this)">
        Футболки
    </button>

</div>


<main class="products" id="products">

    <div class="empty" id="empty">
        Ничего не найдено
    </div>

</main>

<!-- ОКНО ТОВАРА -->

<div class="modal" id="modal">

    <div class="modal-content">

        <button class="close" onclick="closeProduct()">
            ×
        </button>

       <div class="modal-image-container">
    <img
        class="modal-image"
        id="modalImage"
    >
</div>

        <div class="modal-info">

            <div
                class="modal-name"
                id="modalName"
            ></div>

            <div
                class="modal-price"
                id="modalPrice"
            ></div>

            <div
                class="modal-description"
                id="modalDescription"
            ></div>

            <div class="colors"></div>

            <div class="sizes-title">
                Размер
            </div>

            <div class="sizes">

    <button class="size" onclick="selectSize(this)">S</button>
    <button class="size" onclick="selectSize(this)">M</button>
    <button class="size" onclick="selectSize(this)">L</button>
    <button class="size" onclick="selectSize(this)">XL</button>

</div>

            </div>

            <button
                class="order"
                onclick="orderProduct()"
            >
                ЗАКАЗАТЬ
            </button>

        </div>

    </div>

</div>


<script>

let selectedSize = "";

function selectSize(button) {

    document.querySelectorAll(".size").forEach(btn => {
        btn.classList.remove("selected");
    });

    button.classList.add("selected");

    selectedSize = button.textContent;

}

let products = [];

async function loadProductsFromSupabase() {
    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", { ascending: true });

    if (error) {
        console.error("Ошибка загрузки товаров:", error);
        return;
    }

    products = data;

    console.log("Товары загружены из Supabase:", products);

    renderCatalogProducts();
}

    function renderCatalogProducts() {

    const container = document.getElementById("products");

    const empty = document.getElementById("empty");

    container.querySelectorAll(".product").forEach(product => {
        product.remove();
    });

    products.forEach((product, index) => {

        const card = document.createElement("div");

        card.className = "product";

        card.dataset.category = product.category || "";
        card.dataset.brand = product.brand || "";
        card.dataset.name = product.name || "";

        card.onclick = function () {
            openProduct(index);
        };

        card.innerHTML = `
            <img
                class="product-image"
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-price">
                    ${product.price}
                </div>

                <div class="product-category">
                    ${product.category === "hoodies" ? "Худи" :
                      product.category === "shoes" ? "Обувь" :
                      product.category === "tshirts" ? "Футболки" :
                      product.category === "jackets" ? "Куртки" :
                      ""}
                </div>

            </div>
        `;

        container.insertBefore(card, empty);
    });
}


function openProduct(index) {

    const product = products[index];

    document.getElementById("modalImage").src = product.image;

    document.getElementById("modalName").textContent = product.name;

    document.getElementById("modalPrice").textContent = product.price;

    document.getElementById("modalDescription").textContent = product.description;

    const colorsContainer = document.querySelector(".colors");

    colorsContainer.innerHTML = "";

    if (product.colors) {

        product.colors.forEach(image => {

            const colorImage = document.createElement("img");

            colorImage.src = image;

            colorImage.className = "color-image";

            colorImage.onclick = function() {
                document.getElementById("modalImage").src = image;
            };

            colorsContainer.appendChild(colorImage);

        });

    }

    const sizesContainer = document.querySelector(".sizes");

    sizesContainer.innerHTML = "";

    product.sizes.forEach(size => {

        const button = document.createElement("button");

        button.className = "size";

        button.textContent = size;

        button.onclick = function() {
            selectSize(this);
        };

        sizesContainer.appendChild(button);

    });

    selectedSize = "";

    document.getElementById("modal").classList.add("show");

}


function closeProduct() {

    document.getElementById("modal").classList.remove("show");

}

  function openMenu() {

    const menu = document.getElementById("sideMenu");
    const button = document.getElementById("menuButton");

    menu.classList.toggle("show");
    button.classList.toggle("open");

    if (menu.classList.contains("show")) {
        button.textContent = "←";
    } else {
        button.textContent = "☰";
    }
}

 function filterBrand(brand) {

    const products = document.querySelectorAll(".product");

    products.forEach(product => {

        if (brand === "all" || product.dataset.brand === brand) {
            product.style.display = "";
        } else {
            product.style.display = "none";
        }

    });

    document.getElementById("sideMenu").classList.remove("show");
    document.getElementById("menuButton").textContent = "☰";
}
    
function orderProduct() {

    if (!selectedSize) {
        alert("Пожалуйста, выберите размер.");
        return;
    }

    window.open("https://t.me/VampManagerr", "_blank");

}


function filterProducts(category, button) {

    document
        .querySelectorAll(".category")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    const items =
        document.querySelectorAll(".product");

    items.forEach(item => {

        if (
            category === "all" ||
            item.dataset.category === category
        ) {

            item.style.display = "block";

        } else {

            item.style.display = "none";

        }

    });

}


document
    .getElementById("search")
    .addEventListener("input", function() {

        const query =
            this.value.toLowerCase();

        let found = 0;

        document
            .querySelectorAll(".product")
            .forEach(item => {

                const name =
                    item.dataset.name.toLowerCase();

                if (name.includes(query)) {

                    item.style.display = "block";

                    found++;

                } else {

                    item.style.display = "none";

                }

            });


        document
            .getElementById("empty")
            .style.display =
                found === 0 ? "block" : "none";

    });


</script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const SUPABASE_URL = "https://xwsfzwjblqgwlkxwlokp.supabase.co";

    const SUPABASE_KEY = "sb_publishable_JuDfyrkFwTumjlYEYs1edA_woFh_nI_";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

loadProductsFromSupabase();
        
</script>

</body>
</html>
